# Omarky kernel hardening (opt-in: omarchy-setup-security-kernel-hardening).
# Chosen to leave games, Steam/Proton, Docker, ROCm/CUDA, profilers and
# Tailscale working. Not set on purpose: ip_forward (Docker, exit nodes),
# perf_event_paranoid (profilers), unprivileged user namespaces (Steam, Flatpak).

# Hide kernel pointers and the kernel log from unprivileged users
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# No unprivileged eBPF; harden the BPF JIT
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# A process may only ptrace its own children (debuggers attach with sudo)
kernel.yama.ptrace_scope = 1
# Stop a root exploit from booting a replacement kernel (one-way until reboot)
kernel.kexec_load_disabled = 1
# Safer handling of files in shared world-writable dirs like /tmp
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.suid_dumpable = 0

# Network: drop spoofed and redirected packets (loose rp_filter keeps Tailscale working)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
